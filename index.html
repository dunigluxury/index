<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Arma tu Hamburguesa</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: space-around; padding: 20px; }
        .panel { border: 2px dashed #ccc; padding: 20px; width: 300px; text-align: center; }
        .ingrediente { padding: 10px; margin: 10px; background: #f0f0f0; cursor: grab; border-radius: 5px; }
        #plato { min-height: 200px; background: #fffbe0; border: 2px solid #e6b800; border-radius: 10px; display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; padding: 10px; }
        .en-hamburguesa { width: 80%; margin: 2px 0; padding: 5px; text-align: center; border-radius: 3px; font-weight: bold; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Panel de Ingredientes Disponibles -->
    <div class="panel">
        <h3>Ingredientes</h3>
        <div class="ingrediente" draggable="true" id="carne" data-precio="3.00" style="background:#8B5A2B; color:white;">Carne ($3.00)</div>
        <div class="ingrediente" draggable="true" id="queso" data-precio="1.00" style="background:#FFD700;">Queso ($1.00)</div>
        <div class="ingrediente" draggable="true" id="lechuga" data-precio="0.50" style="background:#228B22; color:white;">Lechuga ($0.50)</div>
        <div class="ingrediente" draggable="true" id="tomate" data-precio="0.50" style="background:#FF6347; color:white;">Tomate ($0.50)</div>
    </div>

    <!-- Zona de Destino: La Hamburguesa -->
    <div class="panel">
        <h3>Tu Hamburguesa</h3>
        <div id="plato">
            <div class="en-hamburguesa" style="background: #DEB887;">Pan Inferior</div>
            <!-- Los ingredientes arrastrados caerán aquí -->
        </div>
        <h4>Total: $<span id="precio-total">2.00</span></h4>
        <button onclick="reiniciarHamburguesa()">Reiniciar</button>
    </div>

    <script>
        // 1. SELECCIÓN DE ELEMENTOS DEL DOM
        const ingredientes = document.querySelectorAll('.ingrediente');
        const plato = document.getElementById('plato');
        const txtTotal = document.getElementById('precio-total');
        let total = 2.00; // Precio base del pan

        // 2. FUNCIONES DE ARRASTRE (DRAG & DROP)
        ingredientes.forEach(ing => {
            ing.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
            });
        });

        plato.addEventListener('dragover', (e) => {
            e.preventDefault(); // Obligatorio para permitir soltar
        });

        plato.addEventListener('drop', (e) => {
            e.preventDefault();
            const idIngrediente = e.dataTransfer.getData('text/plain');
            const elementoOriginal = document.getElementById(idIngrediente);
            
            if (elementoOriginal) {
                agregarIngredienteAlPlato(elementoOriginal);
            }
        });

        // 3. LÓGICA DE LA APLICACIÓN
        function agregarIngredienteAlPlato(original) {
            // Clonar para visualización
            const nuevoItem = document.createElement('div');
            nuevoItem.classList.add('en-hamburguesa');
            nuevoItem.textContent = original.textContent.split(' (')[0];
            nuevoItem.style.backgroundColor = original.style.backgroundColor;
            nuevoItem.style.color = original.style.color;
            
            // Guardar precio en el clon para poder restarlo después
            const precio = parseFloat(original.getAttribute('data-precio'));
            nuevoItem.setAttribute('data-precio', precio);

            // Función para eliminar al hacer clic
            nuevoItem.addEventListener('click', () => {
                total -= precio;
                nuevoItem.remove();
                txtTotal.textContent = total.toFixed(2);
            });

            // Agregar al plato (encima del pan inferior por flex-direction: column-reverse)
            plato.appendChild(nuevoItem);

            // Actualizar precio
            total += precio;
            txtTotal.textContent = total.toFixed(2);
        }

        function reiniciarHamburguesa() {
            // Eliminar todo excepto el pan base
            const elementos = plato.querySelectorAll('.en-hamburguesa');
            elementos.forEach(el => {
                if (el.textContent !== 'Pan Inferior') el.remove();
            });
            total = 2.00;
            txtTotal.textContent = total.toFixed(2);
        }
    </script>
</body>
</html>
