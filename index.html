<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arma tu Hamburguesa - D'UNIG LUXURY</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030202; }
        .font-futurista { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: linear-gradient(135deg, rgba(28, 25, 23, 0.6) 0%, rgba(12, 10, 9, 0.8) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-oro { background: linear-gradient(135deg, #f5d77f 0%, #dfb347 50%, #c79524 100%); }
    </style>
</head>
<body class="text-stone-200 antialiased min-h-screen flex flex-col justify-between p-4">

    <div class="max-w-xl w-full mx-auto space-y-6">
        <header class="text-center space-y-1">
            <h1 class="text-lg font-black font-futurista text-amber-400 uppercase tracking-widest">Arma tu Producto VIP</h1>
            <p class="text-xs text-stone-400">Arrastra los ingredientes hacia la zona de armado para construir tu orden.</p>
        </header>

        <!-- ZONA DE ARMADO (EL PLATO / PAN INFERIOR) -->
        <div id="zona-armado" 
             ondragover="permitirDrop(event)" 
             ondrop="soltarIngrediente(event)"
             class="glass-panel border-2 border-dashed border-amber-500/40 rounded-3xl p-6 min-h-[300px] flex flex-col-reverse items-center justify-start gap-2 relative shadow-2xl transition-all">
            
            <!-- Base fija: Pan inferior -->
            <div class="w-full bg-amber-900/60 border border-amber-500/40 text-amber-200 font-futurista font-bold text-xs py-3 rounded-2xl text-center shadow-lg">
                🍔 Pan Inferior (Base)
            </div>
            
            <!-- Contenedor donde se apilan los ingredientes añadidos -->
            <div id="pila-ingredientes" class="w-full flex flex-col-reverse gap-1.5 items-center">
                <span id="texto-vacio" class="text-xs text-stone-500 italic py-10">Tu hamburguesa está vacía. ¡Arrastra ingredientes aquí!</span>
            </div>
        </div>

        <!-- BANDEJA DE INGREDIENTES DISPONIBLES -->
        <div class="space-y-2">
            <h2 class="text-[10px] uppercase font-futurista text-amber-400 font-bold tracking-widest">Ingredientes Disponibles:</h2>
            <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
                
                <!-- Ingrediente: Carne -->
                <div draggable="true" ondragstart="arrastrar(event)" data-nombre="Carne Jugosa" data-color="bg-red-950/80 border-red-500/50 text-red-300" data-icono="utensils"
                     class="ingrediente-item glass-panel p-3 rounded-2xl border border-stone-800 flex flex-col items-center justify-center gap-1 cursor-grab active:cursor-grabbing hover:border-amber-500/50 transition-all">
                    <i data-lucide="utensils" class="w-5 h-5 text-red-400"></i>
                    <span class="text-[11px] font-medium">Carne</span>
                </div>

                <!-- Ingrediente: Queso -->
                <div draggable="true" ondragstart="arrastrar(event)" data-nombre="Queso Fundido" data-color="bg-amber-950/80 border-amber-500/50 text-amber-300" data-icono="layers"
                     class="ingrediente-item glass-panel p-3 rounded-2xl border border-stone-800 flex flex-col items-center justify-center gap-1 cursor-grab active:cursor-grabbing hover:border-amber-500/50 transition-all">
                    <i data-lucide="layers" class="w-5 h-5 text-amber-400"></i>
                    <span class="text-[11px] font-medium">Queso</span>
                </div>

                <!-- Ingrediente: Lechuga -->
                <div draggable="true" ondragstart="arrastrar(event)" data-nombre="Lechuga Fresca" data-color="bg-emerald-950/80 border-emerald-500/50 text-emerald-300" data-icono="salad"
                     class="ingrediente-item glass-panel p-3 rounded-2xl border border-stone-800 flex flex-col items-center justify-center gap-1 cursor-grab active:cursor-grabbing hover:border-amber-500/50 transition-all">
                    <i data-lucide="salad" class="w-5 h-5 text-emerald-400"></i>
                    <span class="text-[11px] font-medium">Lechuga</span>
                </div>

                <!-- Ingrediente: Tomate -->
                <div draggable="true" ondragstart="arrastrar(event)" data-nombre="Rodajas de Tomate" data-color="bg-rose-950/80 border-rose-500/50 text-rose-300" data-icono="circle"
                     class="ingrediente-item glass-panel p-3 rounded-2xl border border-stone-800 flex flex-col items-center justify-center gap-1 cursor-grab active:cursor-grabbing hover:border-amber-500/50 transition-all">
                    <i data-lucide="circle" class="w-5 h-5 text-rose-500"></i>
                    <span class="text-[11px] font-medium">Tomate</span>
                </div>

            </div>
        </div>

        <!-- Botón para enviar pedido con los ingredientes armados -->
        <button onclick="enviarPedidoArmado()" class="w-full btn-oro text-stone-950 font-futurista font-black py-4 rounded-xl text-xs uppercase tracking-widest shadow-lg cursor-pointer">
            Enviar Pedido Armado por WhatsApp
        </button>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });

        let ingredientesSeleccionados = [];

        function arrastrar(evento) {
            // Guardamos los datos del ingrediente que se está arrastrando
            const target = evento.currentTarget;
            const datos = {
                nombre: target.getAttribute('data-nombre'),
                color: target.getAttribute('data-color'),
                icono: target.getAttribute('data-icono')
            };
            evento.dataTransfer.setData('text/plain', JSON.stringify(datos));
        }

        function permitirDrop(evento) {
            evento.preventDefault(); // Necesario para permitir que se suelte un elemento
        }

        function soltarIngrediente(evento) {
            evento.preventDefault();
            const dataJSON = evento.dataTransfer.getData('text/plain');
            if (!dataJSON) return;
            
            const ingrediente = JSON.parse(dataJSON);
            ingredientesSeleccionados.push(ingrediente);

            actualizarVisualizacionPila();
        }

        function actualizarVisualizacionPila() {
            const pilaContainer = document.getElementById('pila-ingredientes');
            pilaContainer.innerHTML = '';

            if (ingredientesSeleccionados.length === 0) {
                pilaContainer.innerHTML = '<span id="texto-vacio" class="text-xs text-stone-500 italic py-10">Tu hamburguesa está vacía. ¡Arrastra ingredientes aquí!</span>';
                return;
            }

            // Renderizar los ingredientes apilados en tiempo real
            ingredientesSeleccionados.forEach((item, index) => {
                const capaHTML = `
                    <div class="w-full ${item.color} border px-4 py-2.5 rounded-xl font-futurista font-bold text-xs flex items-center justify-between shadow-md animate-fade-in transition-all">
                        <div class="flex items-center gap-2">
                            <i data-lucide="${item.icono}" class="w-4 h-4"></i>
                            <span>${item.nombre}</span>
                        </div>
                        <button onclick="eliminarCapa(${index})" class="text-stone-400 hover:text-white text-xs font-mono cursor-pointer">✕</button>
                    </div>
                `;
                pilaContainer.insertAdjacentHTML('beforeend', capaHTML);
            });

            lucide.createIcons();
        }

        function eliminarCapa(index) {
            ingredientesSeleccionados.splice(index, 1);
            actualizarVisualizacionPila();
        }

        function enviarPedidoArmado() {
            if (ingredientesSeleccionados.length === 0) {
                alert("Por favor arrastra al menos un ingrediente a tu hamburguesa.");
                return;
            }

            let listaNombres = ingredientesSeleccionados.map(i => i.nombre).join(', ');
            let mensaje = encodeURIComponent(`¡Hola! He armado mi hamburguesa personalizada con:\n\n🍔 *Base:* Pan Inferior\n✨ *Capas:* ${listaNombres}\n🍔 *Base:* Pan Superior\n\n¡Quiero ordenar esto!`);
            
            // Reemplaza con tu número de WhatsApp
            window.open(`https://wa.me/584120000000?text=${mensaje}`, '_blank');
        }
    </script>
</body>
</html>
