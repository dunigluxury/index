<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'UNIG LUXURY - Pedidos & Sistema de Referidos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans flex flex-col">

    <!-- Barra de Navegación -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-amber-500 flex items-center gap-2">
                <i class="fa-solid fa-crown"></i> D'UNIG LUXURY
            </h1>
            
            <!-- Indicador visual del Referido Activo -->
            <div id="badge-referido" class="hidden bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-3 py-1 rounded-full items-center gap-1.5">
                <i class="fa-solid fa-gift"></i> Referido: <span id="text-codigo-ref" class="font-mono font-bold"></span>
            </div>

            <!-- Botón del Carrito -->
            <button onclick="toggleCarrito()" class="relative bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition">
                <i class="fa-solid fa-cart-shopping text-amber-500"></i> Carrito
                <span id="contador-carrito-badge" class="bg-amber-500 text-gray-950 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </header>

    <!-- Catálogo Principal -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="mb-8 text-center">
            <h2 class="text-3xl font-extrabold text-white mb-2">Catálogo Exclusivo</h2>
            <p class="text-gray-400 text-sm">Selecciona tus productos y realiza tu pedido VIP en segundos.</p>
        </div>

        <!-- Grid de Productos -->
        <div id="grid-productos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Los productos se cargan mediante JS -->
        </div>
    </main>

    <!-- Modal / Lateral del Carrito y Pago -->
    <div id="modal-carrito" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex justify-end hidden">
        <div class="bg-gray-900 w-full max-w-md h-full p-6 flex flex-col justify-between overflow-y-auto border-l border-gray-800">
            <div>
                <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                    <h3 class="text-xl font-bold flex items-center gap-2">
                        <i class="fa-solid fa-bag-shopping text-amber-500"></i> Tu Pedido
                    </h3>
                    <button onclick="toggleCarrito()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
                </div>

                <!-- Elementos agregados -->
                <div id="lista-carrito" class="space-y-3 mb-6">
                    <!-- Generado por JS -->
                </div>
            </div>

            <!-- Resumen y Pasarela de Confirmación -->
            <div class="border-t border-gray-800 pt-4 space-y-4">
                <div class="flex justify-between text-lg font-bold">
                    <span>Total:</span>
                    <span id="total-carrito" class="text-amber-500">$0.00</span>
                </div>

                <!-- Selección de Banco / Método -->
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Método de Pago</label>
                    <select id="select-metodo-pago" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-gray-200 focus:outline-none focus:border-amber-500">
                        <option value="">Selecciona una opción...</option>
                        <option value="0">Pago Móvil (Banco Plaza)</option>
                        <option value="1">Zelle / Transferencia Directa</option>
                    </select>
                </div>

                <!-- Input de Número de Referencia -->
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Número de Referencia (12 dígitos)</label>
                    <input type="text" id="input-ref-pago" maxlength="12" placeholder="Ej: 123456789012" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-gray-200 focus:outline-none focus:border-amber-500 font-mono">
                </div>

                <!-- Muestra el código de referido capturado -->
                <div id="contenedor-ref-info" class="hidden bg-gray-800/60 p-3 rounded-lg border border-amber-500/20 text-xs">
                    <span class="text-gray-400">Código de Referido aplicado:</span>
                    <div id="display-codigo-referido" class="font-bold text-amber-400 font-mono mt-0.5">NINGUNO</div>
                </div>

                <button onclick="finalizarOrdenWhatsApp()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition shadow-lg shadow-amber-500/10">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Confirmar y Enviar Pedido
                </button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN SUPABASE (Reemplaza con las credenciales de tu proyecto)
        const SUPABASE_URL = "https://TU_PROYECTO.supabase.co";
        const SUPABASE_KEY = "TU_SUPABASE_ANON_KEY";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // BASE DE DATOS LOCAL Y LISTA DE CUENTAS
        const productosBD = [
            { id: 1, titulo: "Combo Burger VIP", precio: 12.00, desc: "Hamburguesa doble carne, cheddar, papas y bebida." },
            { id: 2, titulo: "Pizza Especial Planeta", precio: 18.00, desc: "Salsa de la casa, pepperoni extra, jamón y queso gouda." },
            { id: 3, titulo: "Ración Papas Supreme", precio: 6.00, desc: "Papas crujientes bañadas en queso y tocineta." }
        ];

        const cuentasDB = [
            { plataforma: "Pago Móvil", banco: "Banco Plaza" },
            { plataforma: "Zelle", banco: "Bank of America" }
        ];

        let carrito = [];

        // 1. Detección y Almacenamiento del Código de Referido desde la URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codigoReferido = urlParams.get('ref');

            if (codigoReferido) {
                localStorage.setItem('dunig_ref_code', codigoReferido);
            }

            verificarReferidoGuardado();
            renderProductos();
        });

        function verificarReferidoGuardado() {
            const refGuardado = localStorage.getItem('dunig_ref_code');
            const badge = document.getElementById('badge-referido');
            const textRef = document.getElementById('text-codigo-ref');
            const displayRef = document.getElementById('display-codigo-referido');
            const contenedorRef = document.getElementById('contenedor-ref-info');

            if (refGuardado) {
                badge.classList.remove('hidden');
                badge.classList.add('flex');
                textRef.innerText = refGuardado;
                displayRef.innerText = refGuardado;
                contenedorRef.classList.remove('hidden');
            }
        }

        // 2. Renderizado de Productos
        function renderProductos() {
            const container = document.getElementById('grid-productos');
            container.innerHTML = productosBD.map(p => `
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 flex flex-col justify-between hover:border-amber-500/30 transition">
                    <div>
                        <h3 class="text-lg font-bold text-white mb-1">${p.titulo}</h3>
                        <p class="text-gray-400 text-xs mb-4">${p.desc}</p>
                    </div>
                    <div class="flex items-center justify-between mt-2">
                        <span class="text-xl font-black text-amber-500">$${p.precio.toFixed(2)}</span>
                        <button onclick="agregarAlCarrito(${p.id})" class="bg-gray-800 hover:bg-amber-500 hover:text-gray-950 text-amber-500 text-xs font-bold px-3.5 py-2 rounded-lg transition">
                            + Agregar
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 3. Funciones del Carrito
        function agregarAlCarrito(id) {
            const prod = productosBD.find(p => p.id === id);
            if (prod) {
                carrito.push(prod);
                actualizarCarrito();
            }
        }

        function actualizarCarrito() {
            document.getElementById('contador-carrito-badge').innerText = carrito.length;
            const listaHTML = document.getElementById('lista-carrito');
            
            if(carrito.length === 0) {
                listaHTML.innerHTML = `<p class="text-center text-gray-500 text-xs py-8">Tu carrito está vacío.</p>`;
            } else {
                listaHTML.innerHTML = carrito.map((item, index) => `
                    <div class="flex justify-between items-center bg-gray-800/50 p-3 rounded-lg text-sm border border-gray-800">
                        <div>
                            <p class="font-semibold text-white">${item.titulo}</p>
                            <p class="text-xs text-amber-500">$${item.precio.toFixed(2)}</p>
                        </div>
                        <button onclick="eliminarDelCarrito(${index})" class="text-red-400 hover:text-red-300 text-xs p-1">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `).join('');
            }

            const total = carrito.reduce((sum, item) => sum + item.precio, 0);
            document.getElementById('total-carrito').innerText = `$${total.toFixed(2)}`;
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarrito();
        }

        function toggleCarrito() {
            document.getElementById('modal-carrito').classList.toggle('hidden');
        }

        // 4. Envío de Orden a Supabase y WhatsApp
        async function finalizarOrdenWhatsApp() {
            if (carrito.length === 0) {
                alert("Agrega al menos un producto al carrito.");
                return;
            }

            const refPago = document.getElementById('input-ref-pago').value.trim();
            const idxMetodo = document.getElementById('select-metodo-pago').value;

            if (idxMetodo === "" || !cuentasDB[idxMetodo]) {
                alert("Por favor selecciona un método de pago.");
                return;
            }

            if (!/^\d{12}$/.test(refPago)) {
                alert("Por favor ingresa un número de referencia válido de exactamente 12 dígitos.");
                return;
            }

            // Obtiene el código de referido guardado en el navegador o coloca 'NINGUNO'
            const codigoReferidoCliente = localStorage.getItem('dunig_ref_code') || 'NINGUNO';

            const cuenta = cuentasDB[idxMetodo];
            const total = carrito.reduce((a, b) => a + b.precio, 0);
            const listaTexto = carrito.map(i => `• ${i.titulo} ($${i.precio.toFixed(2)})`).join('\n');

            let wsNum = "584120000000"; // Número WhatsApp de respaldo

            try {
                // Registro de la orden en la tabla de Supabase con la columna 'codigo_referido'
                await supabaseClient.from('ordenes_vip').insert([{
                    productos: carrito.map(i => i.titulo).join(', '),
                    total: total,
                    referencia: refPago,
                    estado: "Pendiente",
                    codigo_referido: codigoReferidoCliente
                }]);
            } catch(e) {
                console.error("Error al registrar en Supabase:", e);
            }

            // Construcción del mensaje para WhatsApp
            const mensaje = `👑 *ORDEN VIP - D'UNIG LUXURY* 👑\n\n${listaTexto}\n\n💵 *TOTAL:* $${total.toFixed(2)}\n🏦 *PAGO:* ${cuenta.plataforma} (${cuenta.banco})\n🔢 *REF PAGO:* ${refPago}\n🎁 *CÓD. REFERIDO:* ${codigoReferidoCliente}`;

            // Resetear carrito y almacenamiento local
            carrito = [];
            actualizarCarrito();
            document.getElementById('input-ref-pago').value = "";
            localStorage.removeItem('dunig_ref_code');
            document.getElementById('badge-referido').classList.add('hidden');
            toggleCarrito();

            // Abrir API de WhatsApp
            window.open(`https://api.whatsapp.com/send?phone=${wsNum}&text=${encodeURIComponent(mensaje)}`, '_blank');
        }
    </script>
</body>
</html>
